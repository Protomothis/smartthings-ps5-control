# Skeleton for the home server. Until the HTTP server exists this only shows
# the privileges the container needs; run the CLI with
#   docker compose run --rm ps5 status --ip 192.168.1.20
#   docker compose run --rm ps5 adapter --hci hci0
services:
  ps5:
    build: .
    image: ghcr.io/protomothis/smartthings-ps5-control:dev
    container_name: ps5-control
    # Raw HCI sockets and the UDP probe live in the host network namespace.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - ./data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32m
