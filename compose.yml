# Home server deployment. The container uses the host network namespace
# (raw HCI sockets + UDP probe) so no port mappings are needed:
#   http://<server>:8580   API for the Edge driver (GET /status, POST /wake)
#   https://<server>:8543  settings page; self-signed cert, required for WebHID
services:
  ps5:
    build: .   # `docker compose up -d --build` 로 직접 빌드; 없으면 아래 이미지를 받는다
    image: ghcr.io/protomothis/smartthings-ps5-control:latest
    container_name: ps5-control
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    cap_drop:
      - ALL
    read_only: true
    environment:
      PS5_AUTH_USER: ${PS5_AUTH_USER:?set in .env}
      PS5_AUTH_PASS: ${PS5_AUTH_PASS:?set in .env}
      # PS5_HTTP_ADDR: ":8580"
      # PS5_HTTPS_ADDR: ":8543"
      # PS5_TLS_HOSTS: "ps5.lan"   # extra SANs for the self-signed cert
    volumes:
      - ./data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32m
