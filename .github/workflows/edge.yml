name: Edge driver

# Lua tests for the SmartThings Edge driver in `edge/`, plus CLI packaging and
# channel deployment on an `edge-vX.Y.Z` tag.
#
# The Go service has its own workflows (ci.yml, release.yml) and its own `v*`
# tags. The two are versioned independently: the driver ships through a
# SmartThings channel, the service through GitHub Releases and ghcr.
on:
  # No `paths:` on push: a `paths:` filter alongside `tags:` applies to tag
  # pushes too, and a release tag on a commit touching nothing under edge/
  # would silently publish nothing (smartthings-pc-control).
  push:
    branches:
      - main
      - 'milestone/**'
    tags:
      - 'edge-v*'
  pull_request:
    paths:
      - 'edge/**'
      - '.github/workflows/edge.yml'

permissions:
  contents: read

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The only dependency is fengari, pinned exactly in package.json, so
      # `npm install` without a lockfile is already reproducible.
      - name: Install dependencies
        run: npm install

      # tools/lua.js runs the Lua 5.3 suite under fengari (plain CommonJS, so
      # the same command works under node here and under bun locally).
      - name: Test
        run: npm test

      - name: Syntax check
        run: node tools/lua.js tests/syntax.lua

      # The hub runs C Lua 5.3, not fengari, so the suite runs under the real
      # interpreter as well.
      - name: Install Lua 5.3 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.3 lua-check
          lua5.3 -v
          luacheck --version

      - name: Test (Lua 5.3)
        run: lua5.3 tests/run.lua

      - name: Syntax check (Lua 5.3)
        run: lua5.3 tests/syntax.lua

      # What is packaged is the comment-stripped copy tools/build.js writes to
      # build/edge/ (line numbers are kept, so hub logs still point into
      # src/). The whole suite runs against it too.
      - name: Build the package tree
        run: |
          node tools/build.js --self-test
          node tools/build.js

      - name: Test the package tree (Lua 5.3)
        run: |
          lua5.3 tests/run.lua --src build/edge/src
          lua5.3 tests/syntax.lua --src build/edge/src

      # Settings and the reasons for them are in edge/.luacheckrc.
      - name: luacheck
        run: luacheck --codes src tests

  package:
    # Only ever runs for an `edge-v*` tag.
    if: startsWith(github.ref, 'refs/tags/edge-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # softprops/action-gh-release attaches assets to the tag
    env:
      SMARTTHINGS_TOKEN: ${{ secrets.SMARTTHINGS_TOKEN }}
      ST_CHANNEL_ID: ${{ secrets.ST_CHANNEL_ID }}
    # Required repository secrets (Settings -> Secrets and variables -> Actions):
    #
    #   SMARTTHINGS_TOKEN  A SmartThings Personal Access Token from
    #                      https://account.smartthings.com/tokens with the
    #                      scopes `Devices`, `Drivers` (r/w) and `Channels` (r/w).
    #   ST_CHANNEL_ID      UUID of the distribution channel, from
    #                      `smartthings edge:channels`.
    #
    # Without them the job still builds the zip and creates the GitHub
    # release; the upload/assign steps are skipped and the channel is updated
    # by hand with the CLI.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # config.yml has no standard `version` field, so src/driver_version.lua
      # is the single source of truth. A tag that disagrees with it would
      # publish a driver whose self-reported version is wrong. Fail loudly.
      - name: Check tag against src/driver_version.lua
        run: |
          tag_version="${GITHUB_REF_NAME#edge-v}"
          file_version=$(sed -n 's/^[[:space:]]*return[[:space:]]*"\(.*\)".*$/\1/p' edge/src/driver_version.lua | tail -n 1)
          echo "tag=${GITHUB_REF_NAME} -> ${tag_version}, edge/src/driver_version.lua -> ${file_version}"
          if [ -z "$file_version" ]; then
            echo "::error file=edge/src/driver_version.lua::could not read the version string"
            exit 1
          fi
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error file=edge/src/driver_version.lua::tag ${GITHUB_REF_NAME} expects version \"${tag_version}\" but the file says \"${file_version}\""
            exit 1
          fi

      - name: Install the SmartThings CLI
        run: npm i -g @smartthings/cli

      - name: Build the package tree
        run: node edge/tools/build.js

      # With a token the CLI builds the zip (--build-only never contacts
      # SmartThings); without one the CLI refuses to start, so the zip is
      # assembled from the same three entries the CLI packages.
      - name: Build the driver package
        run: |
          zip_name="smartthings-ps5-control-${GITHUB_REF_NAME}.zip"
          if [ -n "${SMARTTHINGS_TOKEN}" ]; then
            smartthings edge:drivers:package edge/build/edge --build-only "$zip_name"
          else
            echo "SMARTTHINGS_TOKEN is not set: building the zip without the CLI"
            (cd edge/build/edge && zip -r "../../../$zip_name" config.yml profiles src)
          fi
          unzip -l "$zip_name"

      - name: Upload the driver to SmartThings
        if: ${{ env.SMARTTHINGS_TOKEN != '' && env.ST_CHANNEL_ID != '' }}
        run: smartthings edge:drivers:package edge/build/edge --json | tee package-result.json

      - name: Assign the driver to the channel
        if: ${{ env.SMARTTHINGS_TOKEN != '' && env.ST_CHANNEL_ID != '' }}
        run: |
          driver_id=$(jq -r '.driverId' package-result.json)
          version=$(jq -r '.version' package-result.json)
          if [ -z "$driver_id" ] || [ "$driver_id" = "null" ]; then
            echo "::error::edge:drivers:package returned no driverId"
            cat package-result.json
            exit 1
          fi
          echo "assigning driver ${driver_id} version ${version}"
          smartthings edge:channels:assign "$driver_id" "$version" --channel "${ST_CHANNEL_ID}"

      # Release notes = the matching section of edge/CHANGELOG.md.
      - name: Extract the release notes from edge/CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#edge-v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]") > 0) { found = 1; next } }
            found { print }
          ' edge/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "_edge/CHANGELOG.md has no [$version] section._" > release-notes.md
          fi
          cat release-notes.md

      - name: Attach the package to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            smartthings-ps5-control-${{ github.ref_name }}.zip
            package-result.json
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          # Never GitHub's "Latest": that slot belongs to the server's v* release.
          make_latest: false
          name: Edge driver ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: false
