# Device screen for a PS5 behind the ps5-control service. Standard capabilities
# only: the switch is the console's power (on = on, off = rest mode or off), the
# refresh button polls now. The screen a device gets is frozen at creation, so
# a change here is a new file and name (ps5-v2.yml / ps5.v2), never an edit.
name: ps5.v1
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: GameConsole
preferences:
  - name: serverAddress
    title: 서버 주소 (Server address)
    description: "ps5-control 컨테이너가 도는 홈서버의 IPv4 주소(예: 192.168.1.50). 비워 두면 검색(SSDP)으로 찾은 주소를 쓰고 바뀌면 따라갑니다. 채우면 언제나 이 값이 우선합니다. / IPv4 address of the server; empty means follow SSDP discovery."
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 45
      default: ""
  - name: serverPort
    title: 서버 포트 (Server port)
    description: "ps5-control 의 HTTP 포트(기본 8580). HTTPS 포트가 아닙니다. / Plain HTTP port of ps5-control (default 8580), not the HTTPS one."
    required: false
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 65535
      default: 8580
  - name: secret
    title: API 시크릿 (API secret)
    description: "서버 설정 페이지의 API 시크릿. X-PS5-Secret 헤더로 보냅니다. 비어 있으면 보내지 않습니다. Edge에는 비밀번호 입력 타입이 없어 입력 중 화면에 그대로 보입니다. / Sent as the X-PS5-Secret header; visible while typing."
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 64
      default: ""
  - name: offAction
    title: 스위치 끄기 동작 (Off action)
    description: "휴식 모드는 서버에 Remote Play 등록이 되어 있어야 합니다. / Rest mode needs the Remote Play registration on the server."
    required: true
    preferenceType: enumeration
    definition:
      options:
        standby: 휴식 모드 (Rest mode)
        ignore: 무시 (Ignore)
      default: standby
  - name: pollInterval
    title: 상태 확인 주기 (Poll interval)
    description: "드라이버가 서버에 PS5 상태를 묻는 주기. / How often the driver asks the server for the PS5 state."
    required: true
    preferenceType: enumeration
    definition:
      options:
        "10": 10초마다 (10 s)
        "30": 30초마다 (30 s)
        "60": 1분마다 (1 min)
        "300": 5분마다 (5 min)
      default: "30"
